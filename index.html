<!-- ================================
     PANTALLA DE MANTENIMIENTO
     ================================ -->

<div id="maintenance-screen">

    <div class="maintenance-orbit orbit-1"></div>
    <div class="maintenance-orbit orbit-2"></div>
    <div class="maintenance-orbit orbit-3"></div>

    <div class="maintenance-glow glow-1"></div>
    <div class="maintenance-glow glow-2"></div>

    <div class="maintenance-content">

        <div class="maintenance-icon">
            <div class="icon-ring">
                ⚙
            </div>
        </div>

        <span class="maintenance-label">
            ELEGIDOS · PORTAL
        </span>

        <h1>
            EN<br>
            MANTENIMIENTO
        </h1>

        <p>
            Estamos realizando algunas mejoras en el portal.
            <br>
            Regresaremos pronto.
        </p>

        <div class="maintenance-loader">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="maintenance-status">
            <span class="status-dot"></span>
            SISTEMA EN ACTUALIZACIÓN
        </div>

    </div>

</div>

<style>

    /* ========================================
       PANTALLA COMPLETA
       ======================================== */

    #maintenance-screen {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        background:
            radial-gradient(
                circle at 75% 20%,
                rgba(139, 0, 255, .18),
                transparent 35%
            ),
            radial-gradient(
                circle at 20% 80%,
                rgba(255, 0, 200, .14),
                transparent 35%
            ),
            #ffffff;

        font-family: 'Inter', Arial, sans-serif;

    }


    /* ========================================
       CONTENIDO
       ======================================== */

    .maintenance-content {

        position: relative;

        z-index: 10;

        width: min(90%, 700px);

        text-align: center;

        display: flex;

        flex-direction: column;

        align-items: center;

        animation: maintenanceAppear 1s ease forwards;

    }


    /* ========================================
       ICONO
       ======================================== */

    .maintenance-icon {

        width: 100px;

        height: 100px;

        display: flex;

        align-items: center;

        justify-content: center;

        margin-bottom: 28px;

    }

    .icon-ring {

        width: 82px;

        height: 82px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 38px;

        color: #ffffff;

        background:
            linear-gradient(
                135deg,
                #8b00ff,
                #ff00c8,
                #ff6a00
            );

        box-shadow:
            0 20px 50px rgba(139,0,255,.25);

        animation: rotateGear 8s linear infinite;

    }


    /* ========================================
       ETIQUETA
       ======================================== */

    .maintenance-label {

        font-size: 12px;

        font-weight: 800;

        letter-spacing: 4px;

        color: #777777;

        margin-bottom: 20px;

    }


    /* ========================================
       TITULO
       ======================================== */

    .maintenance-content h1 {

        margin: 0;

        font-size: clamp(4rem, 9vw, 8rem);

        line-height: .78;

        letter-spacing: -7px;

        font-weight: 950;

        color: #080808;

        text-transform: uppercase;

        background:
            linear-gradient(
                90deg,
                #000000 20%,
                #8b00ff 50%,
                #ff00c8 75%,
                #000000 100%
            );

        background-size: 250% auto;

        -webkit-background-clip: text;

        -webkit-text-fill-color: transparent;

        animation: titleGradient 6s ease infinite;

    }


    /* ========================================
       TEXTO
       ======================================== */

    .maintenance-content p {

        margin-top: 30px;

        font-size: 17px;

        line-height: 1.6;

        color: #737373;

        font-weight: 500;

    }


    /* ========================================
       LOADER
       ======================================== */

    .maintenance-loader {

        display: flex;

        align-items: center;

        gap: 8px;

        margin-top: 35px;

    }

    .maintenance-loader span {

        width: 9px;

        height: 9px;

        border-radius: 50%;

        background:
            linear-gradient(
                135deg,
                #8b00ff,
                #ff00c8
            );

        animation: loadingDots 1.4s infinite ease-in-out;

    }

    .maintenance-loader span:nth-child(2) {
        animation-delay: .18s;
    }

    .maintenance-loader span:nth-child(3) {
        animation-delay: .36s;
    }


    /* ========================================
       ESTADO
       ======================================== */

    .maintenance-status {

        margin-top: 22px;

        display: flex;

        align-items: center;

        gap: 9px;

        font-size: 11px;

        font-weight: 800;

        letter-spacing: 2px;

        color: #999999;

    }

    .status-dot {

        width: 8px;

        height: 8px;

        border-radius: 50%;

        background: #8b00ff;

        box-shadow:
            0 0 0 0 rgba(139,0,255,.5);

        animation: statusPulse 1.8s infinite;

    }


    /* ========================================
       ELEMENTOS DECORATIVOS
       ======================================== */

    .maintenance-glow {

        position: absolute;

        width: 350px;

        height: 350px;

        border-radius: 50%;

        filter: blur(80px);

        pointer-events: none;

        opacity: .18;

        animation: floatingGlow 8s ease-in-out infinite;

    }

    .glow-1 {

        top: -150px;

        right: -100px;

        background: #8b00ff;

    }

    .glow-2 {

        bottom: -170px;

        left: -100px;

        background: #ff00c8;

        animation-delay: -3s;

    }


    /* ========================================
       ÓRBITAS
       ======================================== */

    .maintenance-orbit {

        position: absolute;

        border: 1px solid rgba(139,0,255,.10);

        border-radius: 50%;

        pointer-events: none;

    }

    .orbit-1 {

        width: 650px;

        height: 650px;

        animation: orbitRotate 25s linear infinite;

    }

    .orbit-2 {

        width: 900px;

        height: 420px;

        transform: rotate(-25deg);

        border-color: rgba(255,0,200,.08);

        animation: orbitFloat 12s ease-in-out infinite;

    }

    .orbit-3 {

        width: 1100px;

        height: 550px;

        transform: rotate(20deg);

        border-color: rgba(255,106,0,.06);

        animation: orbitFloat 16s ease-in-out infinite reverse;

    }


    /* ========================================
       ANIMACIONES
       ======================================== */

    @keyframes maintenanceAppear {

        from {

            opacity: 0;

            transform: translateY(25px) scale(.97);

        }

        to {

            opacity: 1;

            transform: translateY(0) scale(1);

        }

    }


    @keyframes rotateGear {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }


    @keyframes titleGradient {

        0% {
            background-position: 0% center;
        }

        50% {
            background-position: 100% center;
        }

        100% {
            background-position: 0% center;
        }

    }


    @keyframes loadingDots {

        0%, 80%, 100% {
            transform: scale(.6);
            opacity: .4;
        }

        40% {
            transform: scale(1.2);
            opacity: 1;
        }

    }


    @keyframes statusPulse {

        0% {
            box-shadow: 0 0 0 0 rgba(139,0,255,.5);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(139,0,255,0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(139,0,255,0);
        }

    }


    @keyframes floatingGlow {

        0%,100% {
            transform: translate(0,0);
        }

        50% {
            transform: translate(30px,-25px);
        }

    }


    @keyframes orbitRotate {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }


    @keyframes orbitFloat {

        0%,100% {
            transform: translateY(0) rotate(-25deg);
        }

        50% {
            transform: translateY(-25px) rotate(-20deg);
        }

    }


    /* ========================================
       SMARTPHONE
       ======================================== */

    @media (max-width: 600px) {

        #maintenance-screen {
            padding: 25px;
        }

        .maintenance-label {
            font-size: 9px;
            letter-spacing: 3px;
        }

        .maintenance-content h1 {
            font-size: clamp(3.5rem, 17vw, 5.5rem);
            letter-spacing: -5px;
        }

        .maintenance-content p {
            font-size: 14px;
        }

        .maintenance-icon {
            margin-bottom: 20px;
        }

        .icon-ring {
            width: 70px;
            height: 70px;
            font-size: 30px;
        }

        .orbit-1 {
            width: 450px;
            height: 450px;
        }

        .orbit-2 {
            width: 600px;
            height: 300px;
        }

        .orbit-3 {
            width: 700px;
            height: 350px;
        }

    }

</style>
