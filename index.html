<!-- =========================================================
     CENTRO DE ANUNCIOS IMPORTANTES · ELEGIDOS
     Reemplaza completamente tu bloque de mantenimiento actual
     ========================================================= -->

<div id="maintenance-screen">

    <!-- FONDOS ANIMADOS -->
    <div class="announcement-glow glow-1"></div>
    <div class="announcement-glow glow-2"></div>
    <div class="announcement-orbit orbit-1"></div>
    <div class="announcement-orbit orbit-2"></div>
    <div class="announcement-orbit orbit-3"></div>

    <!-- CONTENIDO -->
    <div class="announcement-content">

        <!-- ICONO -->
        <div class="announcement-icon">
            <div class="icon-ring" id="announcement-icon">
                📢
            </div>
        </div>

        <!-- ETIQUETA -->
        <span class="announcement-label">
            ELEGIDOS · PORTAL ESTUDIANTIL
        </span>

        <!-- TIPO DE AVISO -->
        <div class="announcement-type" id="announcement-type">
            AVISO IMPORTANTE
        </div>

        <!-- TITULO -->
        <h1 id="announcement-title">
            Próximamente
        </h1>

        <!-- FECHA -->
        <div class="announcement-date" id="announcement-date">
            00 · 00 · 2026
        </div>

        <!-- DESCRIPCIÓN -->
        <p id="announcement-description">
            Estamos preparando información importante para ti.
        </p>

        <!-- INFORMACIÓN EXTRA -->
        <div class="announcement-info" id="announcement-info">
            <span class="info-icon">◉</span>
            <span id="announcement-info-text">
                Revisa nuestras redes para mantenerte informado.
            </span>
        </div>

        <!-- INDICADORES -->
        <div class="announcement-loader">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- ESTADO -->
        <div class="announcement-status">
            <span class="status-dot"></span>
            INFORMACIÓN DEL PORTAL
        </div>

        <!-- BOTÓN -->
        <button
            class="announcement-button"
            onclick="cerrarCentroAnuncios()">
            Continuar al portal
            <span>→</span>
        </button>

    </div>

</div>


<style>

/* =========================================================
   VARIABLES
   ========================================================= */

#maintenance-screen {

    --purple: #8b00ff;
    --pink: #ff00c8;
    --orange: #ff6a00;
    --dark: #090909;
    --muted: #737373;

}


/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */

#maintenance-screen {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 999999;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    padding: 30px;

    font-family:
        'Inter',
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 80% 15%,
            rgba(139,0,255,.20),
            transparent 32%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(255,0,200,.16),
            transparent 32%
        ),

        radial-gradient(
            circle at 60% 100%,
            rgba(255,106,0,.10),
            transparent 30%
        ),

        #ffffff;

}


/* =========================================================
   CONTENEDOR
   ========================================================= */

.announcement-content {

    position: relative;

    z-index: 20;

    width: min(92%, 720px);

    padding: 55px 50px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.96),
            rgba(255,255,255,.78)
        );

    border:

        1px solid
        rgba(255,255,255,.85);

    border-radius: 42px;

    box-shadow:

        0 40px 100px
        rgba(80,30,130,.12),

        inset 0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter: blur(25px);

    -webkit-backdrop-filter: blur(25px);

    animation:

        announcementAppear
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;

}


/* =========================================================
   ICONO
   ========================================================= */

.announcement-icon {

    width: 92px;

    height: 92px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 20px;

}


.icon-ring {

    width: 76px;

    height: 76px;

    border-radius: 26px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 32px;

    background:

        linear-gradient(
            135deg,
            #8b00ff,
            #ff00c8,
            #ff6a00
        );

    box-shadow:

        0 20px 45px
        rgba(139,0,255,.28);

    animation:

        iconFloat
        3s
        ease-in-out
        infinite;

}


/* =========================================================
   ETIQUETA
   ========================================================= */

.announcement-label {

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 4px;

    color: #888;

    margin-bottom: 15px;

}


/* =========================================================
   TIPO
   ========================================================= */

.announcement-type {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 8px 17px;

    border-radius: 100px;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.5px;

    color: #ffffff;

    background:

        linear-gradient(
            90deg,
            #8b00ff,
            #ff00c8
        );

    box-shadow:

        0 10px 25px
        rgba(139,0,255,.18);

    margin-bottom: 25px;

}


/* =========================================================
   TITULO
   ========================================================= */

.announcement-content h1 {

    margin: 0;

    max-width: 680px;

    font-size:
        clamp(
            3rem,
            7vw,
            6rem
        );

    line-height: .86;

    letter-spacing: -5px;

    font-weight: 950;

    color: #080808;

    background:

        linear-gradient(
            90deg,
            #050505 10%,
            #8b00ff 45%,
            #ff00c8 65%,
            #050505 95%
        );

    background-size: 250% auto;

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:

        titleGradient
        6s
        ease
        infinite;

}


/* =========================================================
   FECHA
   ========================================================= */

.announcement-date {

    margin-top: 22px;

    padding: 10px 20px;

    border-radius: 100px;

    background: rgba(139,0,255,.07);

    border: 1px solid rgba(139,0,255,.10);

    color: #6d28d9;

    font-size: 13px;

    font-weight: 900;

    letter-spacing: 2px;

}


/* =========================================================
   DESCRIPCIÓN
   ========================================================= */

.announcement-content p {

    max-width: 560px;

    margin:

        25px
        auto
        0;

    font-size: 17px;

    line-height: 1.6;

    color: var(--muted);

    font-weight: 500;

}


/* =========================================================
   INFO
   ========================================================= */

.announcement-info {

    width: 100%;

    max-width: 520px;

    margin-top: 25px;

    padding: 17px 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    border-radius: 20px;

    background:

        linear-gradient(
            135deg,
            rgba(139,0,255,.06),
            rgba(255,0,200,.06)
        );

    border:

        1px solid
        rgba(139,0,255,.08);

    color: #555;

    font-size: 13px;

    font-weight: 700;

}


.info-icon {

    color: #8b00ff;

    font-size: 15px;

}


/* =========================================================
   LOADER
   ========================================================= */

.announcement-loader {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 27px;

}


.announcement-loader span {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:

        linear-gradient(
            135deg,
            #8b00ff,
            #ff00c8
        );

    animation:

        loadingDots
        1.4s
        infinite
        ease-in-out;

}


.announcement-loader span:nth-child(2) {

    animation-delay: .18s;

}


.announcement-loader span:nth-child(3) {

    animation-delay: .36s;

}


/* =========================================================
   ESTADO
   ========================================================= */

.announcement-status {

    margin-top: 17px;

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 2px;

    color: #999;

}


.status-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #8b00ff;

    box-shadow:

        0 0 0
        rgba(139,0,255,.5);

    animation:

        statusPulse
        1.8s
        infinite;

}


/* =========================================================
   BOTÓN
   ========================================================= */

.announcement-button {

    margin-top: 28px;

    border: none;

    padding: 15px 27px;

    border-radius: 100px;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    color: #ffffff;

    font-size: 14px;

    font-weight: 900;

    background: #090909;

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.18);

    transition:

        transform .25s ease,
        box-shadow .25s ease;

}


.announcement-button:hover {

    transform: translateY(-3px);

    box-shadow:

        0 20px 40px
        rgba(0,0,0,.22);

}


.announcement-button span {

    font-size: 18px;

}


/* =========================================================
   BRILLOS
   ========================================================= */

.announcement-glow {

    position: absolute;

    width: 380px;

    height: 380px;

    border-radius: 50%;

    filter: blur(85px);

    opacity: .18;

    pointer-events: none;

    animation:

        floatingGlow
        8s
        ease-in-out
        infinite;

}


.glow-1 {

    top: -170px;

    right: -100px;

    background: #8b00ff;

}


.glow-2 {

    bottom: -180px;

    left: -100px;

    background: #ff00c8;

    animation-delay: -3s;

}


/* =========================================================
   ÓRBITAS
   ========================================================= */

.announcement-orbit {

    position: absolute;

    border-radius: 50%;

    pointer-events: none;

}


.orbit-1 {

    width: 650px;

    height: 650px;

    border:

        1px solid
        rgba(139,0,255,.10);

    animation:

        orbitRotate
        25s
        linear
        infinite;

}


.orbit-2 {

    width: 950px;

    height: 430px;

    transform: rotate(-25deg);

    border:

        1px solid
        rgba(255,0,200,.08);

    animation:

        orbitFloat
        12s
        ease-in-out
        infinite;

}


.orbit-3 {

    width: 1150px;

    height: 570px;

    transform: rotate(20deg);

    border:

        1px solid
        rgba(255,106,0,.06);

    animation:

        orbitFloat2
        16s
        ease-in-out
        infinite;

}


/* =========================================================
   ANIMACIONES
   ========================================================= */

@keyframes announcementAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes iconFloat {

    0%,100% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-8px)
            rotate(4deg);

    }

}


@keyframes titleGradient {

    0% {

        background-position: 0% center;

    }

    50% {

        background-position: 100% center;

    }

    100% {

        background-position: 0% center;

    }

}


@keyframes loadingDots {

    0%,80%,100% {

        transform: scale(.6);

        opacity: .4;

    }

    40% {

        transform: scale(1.2);

        opacity: 1;

    }

}


@keyframes statusPulse {

    0% {

        box-shadow:
            0 0 0
            rgba(139,0,255,.5);

    }

    70% {

        box-shadow:
            0 0 0 9px
            rgba(139,0,255,0);

    }

    100% {

        box-shadow:
            0 0 0
            rgba(139,0,255,0);

    }

}


@keyframes floatingGlow {

    0%,100% {

        transform:
            translate(0,0);

    }

    50% {

        transform:
            translate(30px,-25px);

    }

}


@keyframes orbitRotate {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes orbitFloat {

    0%,100% {

        transform:
            translateY(0)
            rotate(-25deg);

    }

    50% {

        transform:
            translateY(-25px)
            rotate(-20deg);

    }

}


@keyframes orbitFloat2 {

    0%,100% {

        transform:
            translateY(0)
            rotate(20deg);

    }

    50% {

        transform:
            translateY(25px)
            rotate(25deg);

    }

}


/* =========================================================
   MÓVIL
   ========================================================= */

@media (max-width:600px) {

    #maintenance-screen {

        padding: 18px;

    }

    .announcement-content {

        width: 100%;

        padding:

            38px
            22px;

        border-radius: 30px;

    }

    .announcement-label {

        font-size: 8px;

        letter-spacing: 2.5px;

    }

    .announcement-content h1 {

        font-size:
            clamp(
                2.8rem,
                15vw,
                4.5rem
            );

        letter-spacing: -4px;

    }

    .announcement-content p {

        font-size: 14px;

    }

    .announcement-info {

        font-size: 11px;

    }

    .announcement-icon {

        margin-bottom: 12px;

    }

    .icon-ring {

        width: 65px;

        height: 65px;

        font-size: 27px;

        border-radius: 21px;

    }

    .orbit-1 {

        width: 430px;

        height: 430px;

    }

    .orbit-2 {

        width: 600px;

        height: 300px;

    }

    .orbit-3 {

        width: 700px;

        height: 350px;

    }

}


/* =========================================================
   OCULTAR CON ANIMACIÓN
   ========================================================= */

#maintenance-screen.hide-announcement {

    animation:

        announcementClose
        .5s
        ease
        forwards;

}


@keyframes announcementClose {

    to {

        opacity: 0;

        transform: scale(1.03);

        pointer-events: none;

    }

}

</style>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

/*
   Si quieres bloquear TODO el portal por mantenimiento,
   cambia esto a true.

   Si está en false, funciona como centro de anuncios.
*/

const MODO_MANTENIMIENTO = false;


/* =========================================================
   FECHAS IMPORTANTES
   Basadas en las fechas actualmente existentes
   en el index.html del portal.
   ========================================================= */

const ANUNCIOS_IMPORTANTES = [

    {
        fecha: "2026-09-27",
        icono: "🎓",
        tipo: "INICIO DEL CURSO",
        titulo: "Inauguración del Curso",
        descripcion:
            "Este domingo comienza oficialmente el curso. Revisa tu portal y prepárate para la primera jornada.",
        info:
            "27 de septiembre · 1:00 PM · Actividad presencial"
    },

    {
        fecha: "2026-09-30",
        icono: "💻",
        tipo: "CLASE IMPORTANTE",
        titulo: "Clase 5",
        descripcion:
            "Tienes una nueva clase programada. Revisa tu calendario académico y permanece atento a la hora de inicio.",
        info:
            "30 de septiembre · 8:00 PM · Modalidad online"
    },

    {
        fecha: "2026-10-04",
        icono: "✨",
        tipo: "EVENTO ELEGIDOS",
        titulo: "Evento ELEGIDOS",
        descripcion:
            "Esta fecha forma parte de las actividades especiales registradas en tu portal.",
        info:
            "4 de octubre · Evento especial ELEGIDOS"
    },

    {
        fecha: "2026-10-25",
        icono: "🎬",
        tipo: "MASTERCLASS",
        titulo: "Masterclass",
        descripcion:
            "Se aproxima una de las actividades especiales del calendario. Mantente atento a las indicaciones.",
        info:
            "25 de octubre · Actividad especial"
    },

    {
        fecha: "2026-10-27",
        icono: "🎬",
        tipo: "MASTERCLASS",
        titulo: "Masterclass",
        descripcion:
            "Fecha registrada para la actividad especial. Consulta las actualizaciones del portal.",
        info:
            "27 de octubre · Actividad especial"
    },

    {
        fecha: "2026-11-08",
        icono: "🎉",
        tipo: "FESTIVAL",
        titulo: "Festival",
        descripcion:
            "Fecha importante registrada dentro del calendario de actividades especiales.",
        info:
            "8 de noviembre · Festival"
    }

];


/* =========================================================
   FECHA EL SALVADOR
   ========================================================= */

function obtenerFechaSV() {

    const ahora = new Date();

    return new Date(

        ahora.toLocaleString(
            "en-US",
            {
                timeZone:
                    "America/El_Salvador"
            }
        )

    );

}


/* =========================================================
   FORMATEAR FECHA
   ========================================================= */

function formatearFechaAnuncio(fecha) {

    const partes =
        fecha.split("-");

    const fechaObj =
        new Date(
            Number(partes[0]),
            Number(partes[1]) - 1,
            Number(partes[2])
        );

    return fechaObj.toLocaleDateString(
        "es-SV",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


/* =========================================================
   CARGAR ANUNCIO
   ========================================================= */

function cargarAnuncioImportante() {

    const ahora =
        obtenerFechaSV();

    const hoy =
        ahora.getFullYear()
        + "-"
        + String(
            ahora.getMonth() + 1
        ).padStart(2, "0")
        + "-"
        + String(
            ahora.getDate()
        ).padStart(2, "0");


    /*
       Buscamos primero un anuncio
       correspondiente a HOY.
    */

    let anuncio =
        ANUNCIOS_IMPORTANTES.find(
            item =>
                item.fecha === hoy
        );


    /*
       Si hoy no hay anuncio,
       buscamos la próxima fecha.
    */

    if (!anuncio) {

        const futuros =
            ANUNCIOS_IMPORTANTES
                .filter(
                    item =>
                        item.fecha > hoy
                )
                .sort(
                    (a,b) =>
                        a.fecha.localeCompare(
                            b.fecha
                        )
                );

        anuncio =
            futuros.length
                ? futuros[0]
                : null;

    }


    /*
       Si ya pasaron todas las fechas,
       mostramos información general.
    */

    if (!anuncio) {

        anuncio = {

            fecha: hoy,

            icono: "📢",

            tipo: "INFORMACIÓN",

            titulo:
                "Mantente informado",

            descripcion:
                "Revisa periódicamente tu portal para conocer nuevas fechas, clases y actividades importantes.",

            info:
                "Portal Estudiantil ELEGIDOS"

        };

    }


    /* ==============================
       INSERTAR DATOS
       ============================== */

    document.getElementById(
        "announcement-icon"
    ).innerText =
        anuncio.icono;


    document.getElementById(
        "announcement-type"
    ).innerText =
        anuncio.tipo;


    document.getElementById(
        "announcement-title"
    ).innerText =
        anuncio.titulo;


    document.getElementById(
        "announcement-date"
    ).innerText =
        formatearFechaAnuncio(
            anuncio.fecha
        );


    document.getElementById(
        "announcement-description"
    ).innerText =
        anuncio.descripcion;


    document.getElementById(
        "announcement-info-text"
    ).innerText =
        anuncio.info;


}


/* =========================================================
   CERRAR CENTRO DE ANUNCIOS
   ========================================================= */

function cerrarCentroAnuncios() {

    const pantalla =
        document.getElementById(
            "maintenance-screen"
        );

    pantalla.classList.add(
        "hide-announcement"
    );


    setTimeout(() => {

        pantalla.style.display =
            "none";

    }, 500);

}


/* =========================================================
   INICIO
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        cargarAnuncioImportante();


        /*
           MODO MANTENIMIENTO REAL

           Si quieres bloquear el portal,
           cambia MODO_MANTENIMIENTO = true.
        */

        if (MODO_MANTENIMIENTO) {

            document.getElementById(
                "announcement-type"
            ).innerText =
                "MANTENIMIENTO";

            document.getElementById(
                "announcement-icon"
            ).innerText =
                "⚙";

            document.getElementById(
                "announcement-title"
            ).innerText =
                "EN MANTENIMIENTO";

            document.getElementById(
                "announcement-description"
            ).innerText =
                "Estamos realizando algunas mejoras en el portal. Regresaremos pronto.";

            document.getElementById(
                "announcement-info-text"
            ).innerText =
                "El acceso estará disponible nuevamente cuando finalicen las actualizaciones.";

            document.querySelector(
                ".announcement-button"
            ).style.display =
                "none";

        }

    }

);

</script>
